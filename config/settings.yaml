agent:
  name: "LYLA"
  version: "0.1.0"
  language: "es"

llm:
  default_provider: "gemini" # opciones: gemini, groq
  gemini:
    model: "gemini-3.5-flash"
    available_models:
      - "gemini-3.5-flash"
      - "gemini-3.5-flash-lite"
      - "gemini-3.1-flash-lite"
      - "gemini-3.8-flash"
    temperature: 0.7
  groq:
    model: "openai/gpt-oss-120b"
    available_models:
      - "openai/gpt-oss-120b"
      - "qwen/qwen3.8-27b"
      - "openai/gpt-oss-20b"
    temperature: 0.7

audio:
  enabled: true
  stt_provider: "groq" # opciones: groq (Whisper Cloud API), gemini
  tts_provider: "edge-tts" # opciones: edge-tts (Cloud), gemini
  voice: "es-MX-DaliaNeural" # o "es-ES-ElviraNeural", "es-MX-JorgeNeural"
  temp_audio_dir: "temp_audio"

memory:
  declarative_path: "config"
  episodic_db_path: "lyla_memory.db"
  max_session_history: 20

theme:
  active: spider-man-classic
